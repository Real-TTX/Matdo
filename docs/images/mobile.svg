<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 780" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <style>
    .t{fill:#202020}.m{fill:#808080}.f{fill:#a0a0a0}.h{font-weight:700}
    .sm{font-size:13px}.xs{font-size:12px}
    .cap{fill:#606060;font-size:14px}
  </style>
  <rect width="820" height="780" fill="#ffffff"/>

  <!-- ===== Phone 1: Today ===== -->
  <g transform="translate(30,30)">
    <rect width="360" height="700" rx="38" fill="#111111"/>
    <rect x="10" y="10" width="340" height="680" rx="30" fill="#ffffff"/>
    <rect x="150" y="10" width="60" height="18" rx="9" fill="#111111"/>
    <clipPath id="s1"><rect x="10" y="10" width="340" height="680" rx="30"/></clipPath>
    <g clip-path="url(#s1)">
      <!-- topbar -->
      <rect x="10" y="34" width="340" height="46" fill="#ffffff"/>
      <line x1="10" y1="80" x2="350" y2="80" stroke="#eceae8"/>
      <g transform="translate(30,50)"><line x1="0" y1="0" x2="16" y2="0" stroke="#808080" stroke-width="2"/><line x1="0" y1="6" x2="16" y2="6" stroke="#808080" stroke-width="2"/><line x1="0" y1="12" x2="16" y2="12" stroke="#808080" stroke-width="2"/></g>
      <text x="180" y="62" class="t h" font-size="15" text-anchor="middle">Matdo</text>
      <g transform="translate(310,49)"><line x1="0" y1="2" x2="16" y2="2" stroke="#8300bc" stroke-width="2"/><line x1="3" y1="8" x2="13" y2="8" stroke="#8300bc" stroke-width="2"/><line x1="6" y1="14" x2="10" y2="14" stroke="#8300bc" stroke-width="2"/></g>

      <!-- title -->
      <text x="30" y="118" class="t h" font-size="20">Today</text>
      <text x="30" y="140" class="m xs">6 tasks</text>

      <!-- rows -->
      <g transform="translate(30,168)" font-size="14">
        <g>
          <circle cx="10" cy="12" r="8" fill="none" stroke="#d1453b" stroke-width="2"/>
          <text x="30" y="10" class="t">Send invoice to Meyer</text>
          <rect x="30" y="20" width="70" height="16" rx="8" fill="#fdeceb"/><text x="65" y="32" class="xs" fill="#d1453b" text-anchor="middle">Yesterday</text>
          <line x1="0" y1="48" x2="300" y2="48" stroke="#f1efed"/>
        </g>
        <g transform="translate(0,58)">
          <circle cx="10" cy="12" r="8" fill="none" stroke="#246fe0" stroke-width="2"/>
          <text x="30" y="10" class="t">Team standup</text>
          <rect x="30" y="20" width="46" height="16" rx="8" fill="#f5f4f2"/><text x="53" y="32" class="xs m" text-anchor="middle">09:30</text>
          <line x1="0" y1="48" x2="300" y2="48" stroke="#f1efed"/>
        </g>
        <g transform="translate(0,116)">
          <circle cx="10" cy="12" r="8" fill="none" stroke="#808080" stroke-width="2"/>
          <text x="30" y="10" class="t">Buy groceries</text>
          <rect x="30" y="20" width="42" height="16" rx="8" fill="#eef7ee"/><text x="51" y="32" class="xs" fill="#1e8e3e" text-anchor="middle">home</text>
          <line x1="0" y1="48" x2="300" y2="48" stroke="#f1efed"/>
        </g>
        <g transform="translate(0,174)">
          <circle cx="10" cy="12" r="8" fill="none" stroke="#eb8909" stroke-width="2"/>
          <text x="30" y="10" class="t">Call the dentist</text>
          <line x1="0" y1="48" x2="300" y2="48" stroke="#f1efed"/>
        </g>
        <g transform="translate(0,232)">
          <circle cx="10" cy="12" r="8" fill="#8300bc"/><path d="M6 12 l3 3 l6 -7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="30" y="10" class="m" text-decoration="line-through">Water the plants</text>
        </g>
        <g transform="translate(0,286)">
          <text x="0" y="12" fill="#8300bc" class="h" font-size="18">+</text>
          <text x="18" y="11" fill="#8300bc">Add task</text>
        </g>
      </g>
    </g>
  </g>
  <text x="210" y="762" class="cap" text-anchor="middle">Today · phone</text>

  <!-- ===== Phone 2: fullscreen filter dialog ===== -->
  <g transform="translate(430,30)">
    <rect width="360" height="700" rx="38" fill="#111111"/>
    <rect x="10" y="10" width="340" height="680" rx="30" fill="#ffffff"/>
    <rect x="150" y="10" width="60" height="18" rx="9" fill="#111111"/>
    <clipPath id="s2"><rect x="10" y="10" width="340" height="680" rx="30"/></clipPath>
    <g clip-path="url(#s2)">
      <!-- fullscreen dialog covers the whole screen -->
      <rect x="10" y="10" width="340" height="680" fill="#ffffff"/>
      <!-- header -->
      <text x="30" y="58" class="t h" font-size="17">Display</text>
      <g transform="translate(300,40)"><rect width="34" height="34" rx="9" fill="#f5f4f2"/><path d="M11 11 l12 12 M23 11 l-12 12" stroke="#202020" stroke-width="2" stroke-linecap="round"/></g>
      <line x1="10" y1="86" x2="350" y2="86" stroke="#eceae8"/>

      <g transform="translate(30,86)" font-size="15">
        <text x="0" y="30" class="f xs h" letter-spacing="1">SORT BY</text>
        <text x="4" y="62" class="t">Manual</text>
        <g transform="translate(0,80)"><rect x="-14" y="-2" width="310" height="34" rx="9" fill="#f3e6f8"/><text x="4" y="21" fill="#8300bc" class="h">Due date</text><path d="M280 12 l5 5 l9 -11" fill="none" stroke="#8300bc" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" transform="translate(-14,0)"/></g>
        <text x="4" y="140" class="t">Priority</text>
        <text x="4" y="180" class="t">Name</text>
        <line x1="-14" y1="200" x2="296" y2="200" stroke="#f1efed"/>

        <text x="0" y="234" class="f xs h" letter-spacing="1">PRIORITY</text>
        <g transform="translate(0,246)">
          <rect x="0" y="0" width="44" height="30" rx="8" fill="#efe7f4"/><text x="22" y="20" fill="#8300bc" class="h sm" text-anchor="middle">All</text>
          <rect x="54" y="0" width="44" height="30" rx="8" fill="#f5f4f2"/><text x="76" y="20" class="m sm" text-anchor="middle">P1</text>
          <rect x="108" y="0" width="44" height="30" rx="8" fill="#f5f4f2"/><text x="130" y="20" class="m sm" text-anchor="middle">P2</text>
          <rect x="162" y="0" width="44" height="30" rx="8" fill="#f5f4f2"/><text x="184" y="20" class="m sm" text-anchor="middle">P3</text>
          <rect x="216" y="0" width="44" height="30" rx="8" fill="#f5f4f2"/><text x="238" y="20" class="m sm" text-anchor="middle">P4</text>
        </g>
        <line x1="-14" y1="300" x2="296" y2="300" stroke="#f1efed"/>

        <g transform="translate(0,322)">
          <text x="4" y="20" class="t">Show completed</text>
          <rect x="248" y="4" width="44" height="24" rx="12" fill="#8300bc"/><circle cx="280" cy="16" r="9" fill="#fff"/>
        </g>
      </g>
    </g>
  </g>
  <text x="610" y="762" class="cap" text-anchor="middle">Full-screen filter dialog</text>
</svg>
