name: Publish image to GHCR

# Baut & veröffentlicht das App-Image für docker-compose.public.yml:
#   ghcr.io/real-ttx/matdo   (App; die Datenbank ist das offizielle postgres-Image)
#
# Nutzt das eingebaute GITHUB_TOKEN – keine Secrets nötig.
# Hinweis: Das Package nach dem ersten Lauf einmalig auf "Public" stellen
# (GitHub -> Packages -> matdo -> Package settings -> Change visibility),
# damit `docker compose up` es ohne Login ziehen kann.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Aussagekräftige, nachvollziehbare Version:
      #  - Tag-Build (v*)  -> der Tag selbst (z.B. "v1.2.0")
      #  - main-Build      -> "main-YYYYMMDD-<kurz-SHA>" (statt nur "main", damit man am
      #                       Footer sofort erkennt, ob das Deployment aktuell ist).
      - name: Compute version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=main-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            MATDO_VERSION=${{ steps.ver.outputs.value }}
          # Neben :latest auch ein versioniertes Tag veröffentlichen (Pinning/Rollback).
          tags: |
            ghcr.io/real-ttx/matdo:latest
            ghcr.io/real-ttx/matdo:${{ steps.ver.outputs.value }}
